# newsagent 主配置
# 所有路径相对仓库根目录；可被环境变量或命令行参数覆盖（开发中）。

app:
  timezone: Asia/Shanghai        # 周编号、发布时间均按此时区
  data_dir: data                 # 运行产物根目录（raw/articles/reports/logs/index.sqlite3）

llm:
  provider: openai-compat         # openai-compat | ollama | mock（mock 无 Key 验证流水线）
  model: deepseek-flash          # DeepSeek 官方模型名（2026-09 起：deepseek-flash / deepseek-v4-pro）
  base_url: https://api.deepseek.com/v1
  api_key_env: LLM_API_KEY       # 从 .env 读取的变量名
  temperature: 0.2
  timeout_seconds: 120
  max_retries: 2
  tagger_model: null             # 置为模型名可单独指定打标模型（null = 用 model）
  report_model: null             # 置为模型名可单独指定综述模型（null = 用 model）

collect:
  per_source_limit: 40           # 每源单次采集上限
  fetch_timeout_seconds: 20
  retries: 2
  concurrency: 4                 # 存档下载并发数
  request_interval_seconds: 1.0  # 采集节流（礼貌爬取，降低反爬风险）
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  search:
    enabled: false               # 国内搜索引擎补充；验证可行性后再开启
    engine: bing                 # bing | baidu_news
    keywords: ["智能交通", "车路协同", "智慧高速", "交通信号", "自动驾驶"]
    max_results_per_keyword: 5

classify:
  summary_max_chars: 100         # LLM 输出摘要长度上限（提示词中约定）
  json_retries: 1                # JSON 解析失败额外重试次数
  max_input_chars: 2000          # 单条调用时的正文输入上限（截断防超长）
  batch_size: 10                 # 批次调用：每次请求合并的新闻条数
  batch_concurrency: 2           # 批次并发数
  batch_max_chars_per_item: 1200 # 批次调用时每条正文的截断长度
  vendor_importance_floor: 2     # 厂商动态类新闻的重要度下限（保障占比）

archive:
  strict_week: true              # 只保留目标周（周一~周日）内发布的新闻；无日期则丢弃
  min_text_chars: 300            # 正文长度下限，低于此判为非新闻页
  max_link_density: 0.60         # 链接密度上限（实测：文章页 ≤0.50，列表页 ≥0.74）
  reject_aggregate_titles: true  # 排除"汇总/盘点/合集"类聚合贴

report:
  max_items: 120                 # 综述输入条目上限（超出按重要度截断）
  summary_max_chars: 200         # 输入 LLM 的单条摘要防御性上限（打标摘要约 100 字，通常不触发；截断不加省略号）
  formats: ["html", "docx"]      # 输出格式（html 为自包含单文件）
  schedule_note: "每周一 08:00（Windows 任务计划程序）"

notify:
  enabled: false                 # 失败告警（企业微信/钉钉/飞书群机器人）
  webhook_url_env: NOTIFY_WEBHOOK_URL
  push_weekly: false             # 周报生成后自动推送（钉钉工作通知，个人）
  dingtalk:                      # 钉钉内部应用（企业开放平台创建）
    agent_id_env: DINGTALK_AGENT_ID      # 应用 AgentId
    app_key_env: DINGTALK_APP_KEY        # 应用 AppKey
    app_secret_env: DINGTALK_APP_SECRET  # 应用 AppSecret
    userids_env: DINGTALK_USERIDS        # 收件人 userid，逗号分隔
