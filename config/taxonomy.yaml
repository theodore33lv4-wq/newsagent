# 标签体系（可增删；LLM 只允许从本树中选择，格式 "一级/二级"）
#
# 周报的"类别分布"与"分主题要点"只使用一级标签；二级标签仅用于更细的分类与检索。
taxonomy:
  - name: 市场与项目          # 与市场、项目有关：项目发布、厂商中标、市场分析综述等
    children: [地方项目发布, 厂商中标与订单, 市场分析与综述, 招投标与采购, 投融资动态]

  - name: 政策标准与行业      # 官方或行业整体：政策、标准、赛事、展会等
    children: [国家政策法规, 地方政策举措, 标准规范, 赛事与评选, 展会与会议]

  - name: 交管技术与业务      # 具体交通管理理论、技术与业务场景
    children: [信号控制优化, 交通组织与渠化, 重大活动保障, 车流引导与诱导, 秩序与安全治理]

  - name: 云脑与智能体        # 云端运作的智能交通技术、产品：大模型、智能体、数据集、仿真
    children: [交通大模型, 智能体应用, 数据集与知识库, 仿真与推演, 云平台与数据中台]

  - name: 边缘与终端          # 边侧运作的技术、产品：感知、控制、边缘计算、具身智能、无人机
    children: [感知与识别设备, 信号与诱导设备, 边缘计算设备, 具身智能装备, 无人机与低空装备]
